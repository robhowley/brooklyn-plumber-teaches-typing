name: Verify and deploy static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install static disassembler
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Install dependencies
        run: npm ci
      - name: Install matching browser
        run: npx playwright install --with-deps chromium
      - name: Regenerate pinned source data and build runtime
        env:
          MTT_OBJDUMP: llvm-objdump
        run: npm run build
      - name: Node checks
        run: npm test
      - name: Python checks
        env:
          MTT_OBJDUMP: llvm-objdump
        run: npm run test:python
      - name: Built-site browser checks at root and Pages prefix
        run: npm run test:browser
      - name: Upload Pages runtime
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
